version: 1

# CCR reports cumulative input across coding-tool turns. The base value is a
# cost target and anomaly signal, not a reason to discard a completed bounded
# implementation. Vet may recommend more headroom. Approved issues run against
# max_token_budget as the non-negotiable safety ceiling.
token_budget: 240000
max_vetted_token_estimate: 600000
max_token_budget: 750000
token_budget_headroom_ratio: 1.25
max_minutes: 15
max_files: 5
max_commit_steps: 2
max_search_calls: 1
max_context_tokens: 3200
max_file_tokens: 1400
max_test_commands: 3
max_setup_commands: 1
command_timeout_seconds: 180

# Python supervises these Node processes for both local and Actions runs.
harness_model: qwen-coder
# CCR 2.x requires provider-qualified client model IDs (`provider,model`).
harness_provider: pollinations-code
harness_max_turns: 14
harness_max_output_tokens: 1400
harness_file_read_max_output_tokens: 1400
harness_max_retries: 2
harness_tool_use_concurrency: 3
harness_context_max_chars: 28000
harness_tool_result_max_chars: 3200
harness_stale_tool_result_chars: 400
harness_recent_tool_results: 2
harness_node_heap_mb: 512
harness_stream_queue_max_lines: 32
verification_node_heap_mb: 512
ccr_start_timeout_seconds: 60
blocked_change_prefixes:
  - .github/workflows/
  - .github/actions/
  - .env
  - secrets/

# Explicit manual-test escape hatch. Production automation still requires the
# normal Pick -> Vet approval. Test mode additionally verifies push permission.
test_repositories:
  - elixpo/lixrl.com

guidance_names:
  - AGENTS.md
  - agents.md
  - CLAUDE.md
  - claude.md
  - CONTRIBUTING.md
  - CONTRIBUTING.rst
  - copilot-instructions.md

allowed_command_prefixes:
  - pytest
  - python -m pytest
  - npm test
  - npm run test
  - npm run lint
  - npm run typecheck
  - npm run build
  - npx eslint
  - npx tsc
  - pnpm test
  - pnpm lint
  - pnpm typecheck
  - pnpm build
  - yarn test
  - yarn lint
  - yarn typecheck
  - yarn build
  - ruff check
  - ruff format --check
  - mypy
  - pyright
  - shellcheck

allowed_setup_prefixes:
  - npm ci --ignore-scripts
  - pnpm install --frozen-lockfile --ignore-scripts
  - yarn install --immutable --ignore-scripts
  - python -m pip install -e .
