# PR check — fork-safe (needs no secrets), so external contributors' pull
# requests get checked too. It does not run merely because a feature branch was
# pushed; opening/updating a PR targeting main is the only trigger.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use the production adapter here, not plain `next build`: Cloudflare
      # rejects dynamic routes that omit the Edge Runtime even when Next's
      # build succeeds. Keeping both workflows on the same command prevents a
      # green PR from blocking the production deployment after merge.
      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
