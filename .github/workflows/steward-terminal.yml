name: steward terminal reconciliation

on:
  repository_dispatch:
    types: [steward_terminal]
  workflow_dispatch:
    inputs:
      key:
        description: Tracked owner/repository#PR key
        required: true
      fingerprint:
        description: Pending terminal fingerprint
        required: true

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Steward runtime
        run: pip install -e .
      - name: Finalize merged or closed work
        env:
          ELIXPOO_GITHUB_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
          ELIXPOO_GIST_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GIST_AGENTIC_TOKEN }}
          ELIXPOO_FOLLOWUP_GIST_ID: ${{ vars.ELIXPOO_FOLLOWUP_GIST_ID }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
          ELIXPO_STEWARD_CELEBRATE: ${{ vars.ELIXPO_STEWARD_CELEBRATE || 'false' }}
          STEWARD_KEY: ${{ github.event.client_payload.key || inputs.key }}
          STEWARD_FINGERPRINT: ${{ github.event.client_payload.fingerprint || inputs.fingerprint }}
        run: python -m agents.steward.celebrate --key "$STEWARD_KEY" --fingerprint "$STEWARD_FINGERPRINT"
      - name: Commit terminal receipts
        env:
          CONTROL_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/ledger.json state/steward_celebrate.json
          git diff --cached --quiet || git commit -m "chore(steward): reconcile terminal PR"
          auth=$(printf 'x-access-token:%s' "$CONTROL_TOKEN" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push
