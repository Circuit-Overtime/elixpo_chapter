name: vet

# Manual prototype for the final pre-implementation suitability gate. The
# default target is temporary; pass another public issue URL when dispatching.

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitHub issue URL to verify
        required: false
        default: https://github.com/horsicq/Detect-It-Easy/issues/365
      force:
        description: Recheck an unchanged rejected revision
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Run Vet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
          ISSUE_URL: ${{ inputs.issue_url }}
          FORCE_RECHECK: ${{ inputs.force }}
        run: |
          args=("$ISSUE_URL")
          if [[ "$FORCE_RECHECK" == "true" ]]; then args+=(--force); fi
          python -m agents.vet "${args[@]}"
      - name: Commit verdict memory
        run: |
          git config user.name  "elixpoo[bot]"
          git config user.email "elixpoo[bot]@users.noreply.github.com"
          git add state/vet.json state/rejected_issues.json
          git diff --cached --quiet || git commit -m "chore(vet): record issue verdict"
          git push
