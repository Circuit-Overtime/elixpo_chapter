name: Accounts CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: accounts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: ./biome.sh ci
      - run: npm test
      - run: npm run sdk:build
      - run: npm run sdk:pack

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Validate Cloudflare credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == ENC\[* ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains SOPS ciphertext; store the plaintext API token"
            exit 1
          fi
          npx --no-install wrangler whoami

      - name: Apply D1 migrations
        run: npx --no-install wrangler d1 migrations apply elixpo_auth --remote

      - name: Build Accounts for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: https://accounts.elixpo.com

      - name: Deploy Accounts to Cloudflare Pages
        run: npx --no-install wrangler pages deploy .vercel/output/static --project-name elixpo-accounts --branch main

  publish-sdk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run sdk:build

      - name: Check whether SDK version exists
        id: version
        working-directory: packages/accounts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if npm view "lixaccounts@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SDK
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/accounts
        run: npm publish --access public --tag "${{ steps.version.outputs.tag }}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump SDK to next patch version
        id: next-version
        working-directory: packages/accounts
        run: |
          npm version patch --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit next SDK version to main
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/accounts/package.json
          git commit -m "chore: prepare lixaccounts v${NEXT_VERSION} [skip release]"
          git push origin HEAD:main
