name: LixBlogs CLI release gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-cli:
    name: Packed artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/lixblogs-cli/package-lock.json
      - name: Install and test CLI
        working-directory: packages/lixblogs-cli
        run: |
          npm ci
          npm test
      - name: Build and pack the release artifact
        id: pack
        working-directory: packages/lixblogs-cli
        run: |
          mkdir -p ../../dist
          TARBALL=$(npm pack --silent | tail -n 1)
          test -n "$TARBALL"
          mv "$TARBALL" ../../dist/
          cd ../..
          PACK_ROOT="$RUNNER_TEMP/lixblogs-package"
          mkdir -p "$PACK_ROOT"
          tar -xzf "dist/$TARBALL" -C "$PACK_ROOT"
          UNPACKED_BYTES=$(find "$PACK_ROOT/package" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          PACKED_BYTES=$(wc -c < "dist/$TARBALL")
          if [ "$UNPACKED_BYTES" -gt 102400 ]; then
            echo "Package is ${UNPACKED_BYTES} bytes unpacked; the release budget is 102400 bytes." >&2
            exit 1
          fi
          cd dist
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cd ..
          echo "Packed: ${PACKED_BYTES} bytes; unpacked: ${UNPACKED_BYTES} bytes (budget: 102400)."
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "packed_bytes=$PACKED_BYTES" >> "$GITHUB_OUTPUT"
          echo "unpacked_bytes=$UNPACKED_BYTES" >> "$GITHUB_OUTPUT"
      - name: Install and smoke-test the packed artifact
        run: |
          TARBALL="dist/${{ steps.pack.outputs.tarball }}"
          npm install --prefix "$RUNNER_TEMP/lixblogs-smoke" "$TARBALL"
          CLI="$RUNNER_TEMP/lixblogs-smoke/node_modules/.bin/lixblogs"
          "$CLI" --help
          "$CLI" skill list --json --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: lixblogs-cli-package
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error

  blogs-contract:
    name: Blogs resource contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify auth, lifecycle, analytics, and media boundaries
        run: >-
          node --test
          tests/apiV1Auth.test.mjs
          tests/apiV1Contract.test.mjs
          tests/analytics.test.mjs
          tests/mediaUploadRequest.test.mjs

  accounts-contract:
    name: Accounts device contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: elixpo/accounts.elixpo
          path: accounts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accounts/package-lock.json
      - run: npm ci
        working-directory: accounts
      - name: Verify device approval, refresh rotation, and revocation
        working-directory: accounts
        run: npx vitest run src/lib/__tests__/cli-device-flow-e2e.test.ts
