name: pick

# Chooses ONE provisional target from the triaged queue. Vet records the ledger
# claim only after final suitability approval.

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC (after scout+triage at 06:00)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Run Pick
        run: python -m agents.pick
      - name: Commit choice
        run: |
          git config user.name  "elixpoo[bot]"
          git config user.email "elixpoo[bot]@users.noreply.github.com"
          git add state/pick.json
          git diff --cached --quiet || git commit -m "chore(pick): propose next target"
          git push
