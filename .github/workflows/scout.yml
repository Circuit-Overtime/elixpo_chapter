name: scout

# Discovery squad — sweeps GitHub for candidate repos, writes state/candidates.json.
# Chains forward: on success, Triage runs via workflow_run.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

# Lets the squad commit state back. (Control repo's branch protection must allow
# the elixpoo identity to push state — runtime-agnostic: same job runs on CF later.)
permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agents.scout

      - name: Commit candidates
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/candidates.json state/contracts.json
          git diff --cached --quiet || git commit -m "chore(scout): refresh candidates"
          git push
