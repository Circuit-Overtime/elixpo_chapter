name: Subtree Sync

on:
  schedule:
    - cron: "0 0,4,8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add remotes (idempotent)
        run: |
          repos=(
            "art.elixpo https://github.com/elixpo/elixpoart.git"
            "jackey.elixpo https://github.com/elixpo/elixpojackey.git"
            "chat.elixpo https://github.com/elixpo/elixpochat.git"
            "blogs.elixpo https://github.com/elixpo/elixpoblogs.git"
            "verse.elixpo https://github.com/elixpo/elixpoverse.git"
            "sketch.elixpo https://github.com/elixpo/elixposketch.git"
            "me.elixpo https://github.com/elixpo/elixpome.git"
            "accounts.elixpo https://github.com/elixpo/elixpoaccounts.git"
            "search.elixpo https://github.com/pollinations/lixsearch.git" 
          )

          for entry in "${repos[@]}"; do
            name=${entry%% *}
            url=${entry#* }
            if git remote get-url "$name" >/dev/null 2>&1; then
              echo "remote $name already exists"
            else
              echo "adding remote $name -> $url"
              git remote add "$name" "$url"
            fi
            git fetch "$name" >/dev/null 2>&1 || true
            if [ -d "$name" ] || git ls-tree --name-only HEAD | grep -qx "$name"; then
              echo "subtree $name already present, skipping add"
            else
              echo "adding subtree $name from $name/main"
              git subtree add --prefix="$name" "$name" main -m "Add $name" || true
            fi
          done

      - name: Fetch all subtree remotes
        run: |
          git fetch art.elixpo
          git fetch jackey.elixpo
          git fetch chat.elixpo
          git fetch blogs.elixpo
          git fetch verse.elixpo
          git fetch sketch.elixpo
          git fetch me.elixpo
          git fetch accounts.elixpo
          git fetch search.elixpo

      - name: Pull subtrees
        run: |
          pull_or_readd() {
            local prefix=$1
            local remote=$2
            if git subtree pull --prefix="$prefix" "$remote" main -m "Sync $prefix"; then
              return 0
            fi
            echo "subtree pull failed for $prefix (possibly force-pushed remote), re-adding..."
            git rm -rf "$prefix/" 2>/dev/null || true
            git commit -m "Remove $prefix for re-sync" 2>/dev/null || true
            git subtree add --prefix="$prefix" "$remote" main -m "Re-add $prefix"
          }

          pull_or_readd art.elixpo art.elixpo
          pull_or_readd jackey.elixpo jackey.elixpo
          pull_or_readd chat.elixpo chat.elixpo
          pull_or_readd blogs.elixpo blogs.elixpo
          pull_or_readd verse.elixpo verse.elixpo
          pull_or_readd sketch.elixpo sketch.elixpo
          pull_or_readd me.elixpo me.elixpo
          pull_or_readd accounts.elixpo accounts.elixpo
          pull_or_readd search.elixpo search.elixpo

      - name: Push updates
        run: |
          git push origin main
