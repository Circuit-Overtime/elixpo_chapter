name: Subtree Sync

on:
  schedule:
    - cron: "0 0,4,8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync subtrees
        run: |

          repos=(
            "art.elixpo https://github.com/elixpo/elixpoart.git"
            "jackey.elixpo https://github.com/elixpo/elixpojackey.git"
            "chat.elixpo https://github.com/elixpo/elixpochat.git"
            "blogs.elixpo https://github.com/elixpo/elixpoblogs.git"
            "verse.elixpo https://github.com/elixpo/elixpoverse.git"
            "sketch.elixpo https://github.com/elixpo/elixposketch.git"
            "me.elixpo https://github.com/elixpo/elixpome.git"
            "accounts.elixpo https://github.com/elixpo/elixpoaccounts.git"
          )

          COAUTHOR=$'\n\nCo-authored-by: Circuit-Overtime <ayushbhatt633@gmail.com>'

          for entry in "${repos[@]}"; do
            name=${entry%% *}
            url=${entry#* }

            echo "Processing $name"

            if git remote get-url "$name" >/dev/null 2>&1; then
              echo "remote exists"
            else
              git remote add "$name" "$url"
            fi

            git fetch "$name"

            if [ -d "$name" ] || git ls-tree --name-only HEAD | grep -qx "$name"; then
              echo "Pulling subtree updates for $name"

              git subtree pull \
                --prefix="$name" \
                "$name" main \
                -m "Sync $name$COAUTHOR" || true

            else
              echo "Adding subtree $name"

              git subtree add \
                --prefix="$name" \
                "$name" main \
                -m "Add $name$COAUTHOR"
            fi
          done

      - name: Push updates
        run: git push origin main
