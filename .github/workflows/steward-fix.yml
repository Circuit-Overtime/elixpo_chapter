name: steward fix

on:
  repository_dispatch:
    types: [steward_fix]
  workflow_dispatch:
    inputs:
      key:
        description: Tracked owner/repository#PR key
        required: true
      fingerprint:
        description: Pending follow-up fingerprint
        required: true

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Steward runtime
        run: pip install -e .
      - name: Apply requested PR delta
        env:
          AGENT_GITHUB_SOLVER_TOKEN: ${{ secrets.AGENT_GITHUB_SOLVER_TOKEN }}
          ELIXPOO_GIST_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GIST_AGENTIC_TOKEN }}
          ELIXPOO_FOLLOWUP_GIST_ID: ${{ vars.ELIXPOO_FOLLOWUP_GIST_ID }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
          STEWARD_KEY: ${{ github.event.client_payload.key || inputs.key }}
          STEWARD_FINGERPRINT: ${{ github.event.client_payload.fingerprint || inputs.fingerprint }}
          ELIXPO_WORKSPACE_DIR: /tmp/elixpoo-workspaces
        run: python -m agents.steward.fix --key "$STEWARD_KEY" --fingerprint "$STEWARD_FINGERPRINT"
      - name: Commit bounded follow-up receipt
        if: always()
        env:
          CONTROL_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
        run: |
          if [[ ! -f state/steward_fix.json ]]; then exit 0; fi
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/steward_fix.json state/ledger.json
          git diff --cached --quiet || git commit -m "chore(steward): record PR follow-up"
          auth=$(printf 'x-access-token:%s' "$CONTROL_TOKEN" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push
