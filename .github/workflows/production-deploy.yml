name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate D1 and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit edge routes
        run: npm test

      - name: Build Cloudflare Pages output
        run: npm run pages:build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply elixpourl --remote

      - name: Deploy Cloudflare Pages production
        run: >-
          npx wrangler pages deploy .vercel/output/static
          --project-name=elixpourl
          --branch=main
