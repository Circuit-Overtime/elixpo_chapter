name: triage

# Scores candidate repos' open issues into a ranked queue (state/triaged.json).
# Chains off Scout.

on:
  workflow_run:
    workflows: [scout]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Run Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
        run: python -m agents.triage
      - name: Commit triaged queue
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/triaged.json state/rejected_issues.json
          git diff --cached --quiet || git commit -m "chore(triage): refresh issue queue"
          git push
