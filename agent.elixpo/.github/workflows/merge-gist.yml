name: Merge Gist Digest

on:
  workflow_call:
    inputs:
      pr_number:
        description: "The PR number that was merged"
        required: true
        type: number
    secrets:
      POLLINATIONS_KEY:
        required: true
      GIST_TOKEN:
        required: true
        description: "PAT from elixpoo account with gist scope"

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  update-changelog-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout agent.elixpo
        uses: actions/checkout@v4
        with:
          repository: elixpo/agent.elixpo
          path: agent

      - name: Read project name from manifest
        id: manifest
        run: |
          MANIFEST="repo/.elixpo/project.yml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found at $MANIFEST"
            exit 1
          fi
          # Install yq and extract project.name
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          PROJECT_NAME=$(yq '.project.name // ""' "$MANIFEST")
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Could not read project.name from manifest"
            exit 1
          fi
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run merge gist script
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          python agent/scripts/merge_gist.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ inputs.pr_number }}" \
            --token "$GH_TOKEN" \
            --gist-token "$GIST_TOKEN" \
            --pollinations-key "$POLLINATIONS_KEY" \
            --project-name "${{ steps.manifest.outputs.project_name }}" \
            --manifest-path "repo/.elixpo/project.yml"

      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Collect issue numbers from PR body, title, branch name, and commit messages
            const issueRefs = new Set();
            const patterns = [
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi,
              /\b#(\d+)\b/g
            ];

            const sources = [pr.title || '', pr.body || '', pr.head.ref || ''];

            // Also check commit messages
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            for (const c of commits) {
              sources.push(c.commit.message || '');
            }

            // Extract from closing keywords first (these are definite)
            const closingRefs = new Set();
            for (const src of sources) {
              for (const m of src.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)) {
                closingRefs.add(parseInt(m[1]));
              }
            }

            // Also check branch name pattern: */issue-NNN
            const branchMatch = (pr.head.ref || '').match(/issue-(\d+)/i);
            if (branchMatch) {
              closingRefs.add(parseInt(branchMatch[1]));
            }

            if (closingRefs.size === 0) {
              console.log('No linked issues found to close.');
              return;
            }

            for (const num of closingRefs) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num
                });
                if (issue.state === 'open' && !issue.pull_request) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    body: `Closed by #${prNumber} ✅`
                  });
                  console.log(`Closed issue #${num}`);
                } else {
                  console.log(`Issue #${num} already closed or is a PR, skipping.`);
                }
              } catch (e) {
                console.log(`Could not process issue #${num}: ${e.message}`);
              }
            }
