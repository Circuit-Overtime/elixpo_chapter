name: janitor orphan audit

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Reconcile expired partial cleanup
        env:
          ELIXPO_WORKSPACE_DIR: /tmp/elixpoo-workspaces
          ELIXPO_JANITOR_ORPHAN_TTL_HOURS: ${{ vars.ELIXPO_JANITOR_ORPHAN_TTL_HOURS || 24 }}
        run: python -m agents.janitor --audit
      - name: Commit cleanup receipt
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/solve.json
          if [[ -f state/janitor.json ]]; then git add state/janitor.json; fi
          git diff --cached --quiet || git commit -m "chore(janitor): reconcile cleanup debt"
          git push
