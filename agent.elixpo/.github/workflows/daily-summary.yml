name: OreoFlow daily summary

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Build sanitized summary
        continue-on-error: true
        run: python -m agents.daily_summary
      - name: Commit summary receipt
        env:
          CONTROL_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/daily_summary.json state/contracts.json
          git diff --cached --quiet || git commit -m "chore(summary): record daily agent health"
          auth=$(printf 'x-access-token:%s' "$CONTROL_TOKEN" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push
