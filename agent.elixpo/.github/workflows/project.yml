name: project operations

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: [vet, solve, steward fix, steward terminal reconciliation]
    types: [completed]
  repository_dispatch:
    types: [project_reconcile]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build snapshots without modifying the Project
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Project runtime
        run: pip install -e .
      - name: Reconcile operations board
        env:
          ELIXPOO_GITHUB_PROJECT_TOKEN: ${{ secrets.ELIXPOO_GITHUB_PROJECT_TOKEN }}
          ELIXPO_GITHUB_PROJECT_OWNER: ${{ vars.ELIXPO_GITHUB_PROJECT_OWNER }}
          ELIXPO_GITHUB_PROJECT_NUMBER: ${{ vars.ELIXPO_GITHUB_PROJECT_NUMBER }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m agents.project "${args[@]}"
      - name: Commit sanitized Project receipt
        if: always()
        env:
          CONTROL_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
        run: |
          if [[ ! -f state/project.json ]]; then exit 0; fi
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/project.json
          git diff --cached --quiet || git commit -m "chore(project): reconcile operations view"
          auth=$(printf 'x-access-token:%s' "$CONTROL_TOKEN" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push
