name: vet

# Automatic final pre-implementation suitability gate. Manual dispatch accepts
# an optional diagnostic URL; normal runs consume state/pick.json.

on:
  repository_dispatch:
    types: [steward_vet]
  workflow_run:
    workflows: [pick]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitHub issue URL to verify
        required: false
      force:
        description: Recheck an unchanged rejected revision
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  vet:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Run Vet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
          ISSUE_URL: ${{ inputs.issue_url }}
          FORCE_RECHECK: ${{ inputs.force }}
        run: |
          args=()
          if [[ -n "$ISSUE_URL" ]]; then args+=("$ISSUE_URL"); fi
          if [[ "$FORCE_RECHECK" == "true" ]]; then args+=(--force); fi
          python -m agents.vet "${args[@]}"
      - name: Commit verdict memory
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/vet.json state/rejected_issues.json state/pick.json state/ledger.json state/contracts.json
          git diff --cached --quiet || git commit -m "chore(vet): record issue verdict"
          git push
