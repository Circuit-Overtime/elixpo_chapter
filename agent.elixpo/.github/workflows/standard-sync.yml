name: OreoFlow repository standard sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false
      repository:
        description: Optional repository name without owner
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - config/org_standard.yaml
      - .github/ci_config.py
      - .github/docs/agentic-planner.md
      - .github/scripts/**
      - .github/workflows/elixpo-agent.yml
      - .github/workflows/elixpo-ci.yml
      - .github/workflows/elixpo-triage.yml
      - .github/workflows/elixpoo-ack.yml
      - .github/workflows/elixpoo-retry.yml
      - .github/workflows/on-merge.yml
      - .github/workflows/pr-assign.yml
      - .github/workflows/pr-description-fill.yml
      - .github/workflows/pr-management.yml
      - .github/workflows/quality-gate.yml
      - .github/workflows/stale-management.yml

permissions:
  contents: read

concurrency:
  group: oreoflow-standard-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Compare or publish repository standard
        env:
          ELIXPOO_GITHUB_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
          APPLY: ${{ github.event_name == 'push' || inputs.apply || false }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
          REPOSITORY: ${{ inputs.repository }}
          SCAN_CONCURRENCY: ${{ vars.OREOFLOW_SYNC_CONCURRENCY || '4' }}
        run: |
          args=(--concurrency "$SCAN_CONCURRENCY")
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          if [[ -n "$REPOSITORY" ]]; then args+=(--repo "$REPOSITORY"); fi
          python -m agents.standard_sync "${args[@]}"
