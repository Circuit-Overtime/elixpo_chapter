name: PR Management

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-and-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author and label changed areas
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            try {
              await github.rest.issues.addAssignees({...context.repo, issue_number: pr.number, assignees: [pr.user.login]});
            } catch (error) {
              core.warning(`Could not assign ${pr.user.login}: ${error.message}`);
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: pr.number, per_page: 100});
            const rules = [
              ['frontend', '1d76db', p => p.startsWith('search.elixpo/')],
              ['backend', 'e99695', p => p.startsWith('lixsearch/')],
              ['skills', '7057ff', p => p.startsWith('skills/')],
              ['tests', 'bfd4f2', p => p.startsWith('tester/') || /test[^/]*\.py$/.test(p)],
              ['documentation', '0075ca', p => p.endsWith('.md') || p.startsWith('docs/')],
              ['infrastructure', 'd4c5f9', p => p.startsWith('.github/') || p.startsWith('deploy/') || p.includes('Dockerfile') || p.startsWith('docker-compose')],
              ['dependencies', 'ededed', p => ['requirements.txt', 'package.json', 'package-lock.json', 'pyproject.toml'].includes(p.split('/').pop())],
            ];
            const selected = rules.filter(([, , test]) => files.some(file => test(file.filename)));
            for (const [name, color] of selected) {
              try { await github.rest.issues.getLabel({...context.repo, name}); }
              catch (error) { if (error.status === 404) await github.rest.issues.createLabel({...context.repo, name, color}); }
            }
            if (selected.length) await github.rest.issues.addLabels({...context.repo, issue_number: pr.number, labels: selected.map(([name]) => name)});
