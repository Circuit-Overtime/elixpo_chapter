name: Stale Issue and PR Management

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-message: This issue has had no recent activity. Add an update to keep it open.
          stale-pr-message: This pull request has had no recent activity. Add an update to keep it open.
          close-issue-message: Closed after the stale period. Reopen it if the issue is still relevant.
          close-pr-message: Closed after the stale period. Reopen it when the work is ready to continue.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          operations-per-run: 30
